bio: |
  Michael Borowski (PhD, VU Amsterdam) is affiliated with the Faculty of Religion and Theology
  at Vrije Universiteit Amsterdam, working at the intersection of Philosophy of Science and Theology (www.futureofacademictheology.com). He coordinates the
